<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ZAMIN education</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:var(--tg-theme-secondary-bg-color,#F3F5F9);--card:var(--tg-theme-bg-color,#fff);--ink:var(--tg-theme-text-color,#13203F);
  --muted:var(--tg-theme-hint-color,#6B7691);--line:rgba(127,127,127,.2);
  --brand:#0F3FA6;--gold:#E0A100;--ok:#14915F;--warn:#C27A12;--bad:#D23F3F;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{padding-bottom:96px}
.top{position:sticky;top:0;z-index:5;background:var(--brand);color:#fff;padding:12px 16px 10px;display:flex;gap:12px;align-items:center}
.top img{width:40px;height:40px;border-radius:10px;background:#fff;padding:2px;object-fit:contain}
.top b{display:block;font-size:16px}.top span{font-size:12.5px;opacity:.85}
.top .r{margin-left:auto;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.wrap{padding:12px 12px 0;max-width:720px;margin:0 auto}
.card{background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px}
.nm{font-weight:600}.sm{font-size:12.5px;color:var(--muted)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.lab{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);width:72px;flex:none}
.b{flex:1;min-width:64px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 6px;font:inherit;font-size:14px}
.b.on.p,.b.on.t{background:var(--ok);border-color:var(--ok);color:#fff}
.b.on.l,.b.on.c{background:var(--warn);border-color:var(--warn);color:#fff}
.b.on.a,.b.on.y{background:var(--bad);border-color:var(--bad);color:#fff}
.b.on.f{background:var(--brand);border-color:var(--brand);color:#fff}
.stu{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.pts{font-weight:700;font-variant-numeric:tabular-nums}.pts.n{color:var(--bad)}
.q{display:flex;gap:8px;margin-bottom:10px}
.q button{flex:1;border:0;border-radius:12px;padding:11px;background:var(--card);color:var(--brand);font:inherit;font-weight:600}
.save{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line)}
.save button{width:100%;border:0;border-radius:14px;padding:14px;background:var(--brand);color:#fff;font:inherit;font-weight:700;font-size:16px}
.tabs{display:flex;background:var(--card);border-radius:12px;padding:3px;margin-bottom:10px}
.tabs button{flex:1;border:0;background:none;color:var(--muted);padding:9px;border-radius:9px;font:inherit;font-weight:600}
.tabs button.on{background:var(--brand);color:#fff}
.pod{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px;align-items:end;margin-bottom:10px}
.pod div{background:var(--card);border-radius:14px;padding:12px 6px;text-align:center}
.pod .one{background:#FFF3CC;color:#13203F}
.pod .av{width:42px;height:42px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;color:#fff;font-weight:700}
.pod .one .av{width:52px;height:52px}
.pod b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod i{font-style:normal;font-size:18px;font-weight:700}
.lr{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.lr.me{outline:2px solid var(--brand)}
.lr .k{width:22px;text-align:center;color:var(--muted);font-weight:700}
.lr .w{flex:1;min-width:0}.lr .w b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lr .s{font-weight:700;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:9px;background:var(--bg);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ok)}
.big{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:#FFF3CC;color:#8A5A00}
.chip.ok{background:#DDF4E9;color:#14915F}.chip.w{background:#FDEBD0;color:#B8741A}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g2>div{background:var(--bg);border-radius:12px;padding:10px}
.g2 b{font-size:22px}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line)}.kv:first-child{border-top:0}
h3{margin:0 0 8px;font-size:15px}
.err{padding:30px 16px;text-align:center;color:var(--muted)}

/* --- ixcham davomat (telefon va kompyuterda bir xil) --- */
.wrap{max-width:760px}
.prog{height:4px;background:rgba(255,255,255,.28)}.prog i{display:block;height:100%;background:#fff;transition:width .2s}
.q{margin-bottom:8px}.q button{padding:9px 6px;font-size:13px;border-radius:10px}
.st{background:var(--card);border-radius:12px;padding:8px 10px;margin-bottom:6px;border-left:4px solid var(--line)}
.st.ok{border-left-color:var(--ok)}.st.mid{border-left-color:var(--warn)}.st.abs{border-left-color:var(--muted)}
.who{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.who .n{color:var(--muted);font-size:12px;width:20px;flex:none;text-align:right;font-variant-numeric:tabular-nums}
.who .nm{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .pts{font-weight:700;font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--ok)}.who .pts.n{color:var(--bad)}
.ctl{display:flex;flex-direction:column;gap:5px}
.seg{display:flex;gap:4px}
.seg .b{flex:1;min-width:0;padding:8px 2px;font-size:13px;border-radius:9px;white-space:nowrap}
.seg .b.x{flex:0 0 40px}
.xt{display:flex;gap:4px;margin-top:5px}.xt .b{padding:7px 4px;font-size:12.5px}
.seg.ph{display:none}
.sub{font-size:11px;color:var(--muted);margin:2px 0 4px;text-transform:uppercase;letter-spacing:.04em}
@media(min-width:700px){
  .st{padding:8px 12px}
  .who{margin-bottom:0}
  .st{display:grid;grid-template-columns:minmax(190px,1fr) 2fr;gap:12px;align-items:center}
  .ctl{flex-direction:row;gap:10px;align-items:center}.ctl .seg{flex:1}.ctl .seg.ph{display:flex;visibility:hidden}
  .xt{grid-column:2}
}
</style>
</head>

const head=(t,sub,r)=>`<div class="top"><img src="${LOGO}" alt=""><div><b>${esc(t)}</b><span>${esc(sub)}</span></div>${r!=null?`<div class="r">${r}</div>`:''}</div>`;

/* ---------- DAVOMAT / UYGA VAZIFA ---------- */
function att(){
  const R=D.r,S=D.s.map(x=>({uid:x[0],name:x[1],st:x[2],kech:x[3]||0,f:x[4]||0,m:x[5]||0}));
  // ichki holat: a = 'p'|'l'|'a'|null ; h = 't'|'c'|'y'|null ; xo — qo'shimcha belgilar ochiq
  S.forEach(s=>{if(s.st==='k'){s.a='a';s.h=null}else if(s.st){s.a=s.kech?'l':'p';s.h=s.st}else{s.a=null;s.h=null}s.xo=!!(s.f||s.m)});
  const pts=s=>{if(!s.a)return 0;if(s.a==='a')return R.absent;let v=s.a==='p'?R.present:R.late;v+=s.h==='t'?R.hw_full:s.h==='c'?R.hw_half:s.h==='y'?R.hw_none:0;if(s.f)v+=R.formula;if(s.m)v+=R.mavzu;return v};
  const done=s=>s.a==='a'||(s.a&&s.h);
  const seg=(i,k,opts,cur)=>`<div class="seg">${opts.map(o=>`<button class="b ${o[0]}${cur===o[0]?' on':''}" data-i="${i}" data-${k}="${o[0]}">${o[1]}</button>`).join('')}</div>`;
  function draw(){
    const y=window.scrollY;
    const n=S.filter(done).length;
    $('#app').innerHTML=head(D.g,D.day.split('-').reverse().join('.'),`${n}/${S.length}`)+`<div class="prog"><i style="width:${S.length?Math.round(100*n/S.length):0}%"></i></div><div class="wrap" style="padding-top:10px">
     <div class="q"><button data-q="1">Hammasi keldi + vazifa to'liq</button><button data-q="2">Belgilanmaganlar: kelmadi</button></div>
     ${S.map((s,i)=>{const c=done(s)?(s.a==='a'?'abs':'ok'):(s.a?'mid':'');const here=s.a&&s.a!=='a';
      return `<div class="st ${c}"><div class="who"><span class="n">${i+1}</span><span class="nm">${esc(s.name)}</span><span class="pts ${pts(s)<0?'n':''}">${s.a?(pts(s)>0?'+':'')+pts(s):''}</span></div>
      <div class="ctl">${seg(i,'a',[['p','Keldi'],['l','Kechikdi'],['a','Yo\'q']],s.a)}
      ${here?`<div class="seg">${[['t','To\'liq'],['c','Chala'],['y','Qilmadi']].map(x=>`<button class="b ${x[0]}${s.h===x[0]?' on':''}" data-i="${i}" data-h="${x[0]}">${x[1]}</button>`).join('')}<button class="b x f${s.f||s.m?' on':''}" data-i="${i}" data-x="1">⋯</button></div>`:`<div class="seg ph"><button class="b" disabled style="visibility:hidden">·</button></div>`}</div>
      ${here&&s.xo?`<div class="xt"><button class="b f${s.f?' on':''}" data-i="${i}" data-f="1">Formula topshirmadi</button><button class="b f${s.m?' on':''}" data-i="${i}" data-m="1">Mavzu topshirmadi</button></div>`:''}</div>`}).join('')}
    </div><div class="save"><button id="sv">Saqlash · ${n}/${S.length}</button></div>`;
    window.scrollTo(0,y);
  }
  draw();
  document.addEventListener('click',e=>{
    const t=e.target.closest('button');if(!t)return;const d=t.dataset;
    if(d.q==='1'){S.forEach(s=>{if(!s.a){s.a='p';s.h='t'}else if(s.a!=='a'&&!s.h)s.h='t'});draw();return}
    if(d.q==='2'){S.forEach(s=>{if(!s.a){s.a='a'}});draw();return}
    if(d.i!==undefined){const s=S[+d.i];
      if(d.a){s.a=s.a===d.a?null:d.a;if(s.a==='a'||!s.a){s.h=null;s.f=0;s.m=0;s.xo=false}}
      if(d.h)s.h=s.h===d.h?null:d.h;
      if(d.x)s.xo=!s.xo;
      if(d.f)s.f=s.f?0:1;if(d.m)s.m=s.m?0:1;
      if(tg&&tg.HapticFeedback)try{tg.HapticFeedback.selectionChanged()}catch(_){}
      draw();return}
    if(t.id==='sv'){
      const un=S.filter(s=>s.a&&s.a!=='a'&&!s.h).length;
      if(un&&!window._warned){window._warned=1;t.textContent=`${un} ta o'quvchida vazifa belgilanmagan. Yana bosing, shunda saqlanadi`;return}
      const rows=S.filter(s=>s.a).map(s=>s.a==='a'?[s.uid,'k',0,0,0]:[s.uid,s.h||'y',s.a==='l'?1:0,s.f,s.m]);
      const data=JSON.stringify({mk:1,lid:D.lid,rows});
      if(tg&&tg.sendData)tg.sendData(data);else alert(data)}
  });
}

/* ---------- REYTING / NATIJAM ---------- */
function rank(){
  let tab=P.get('tab')==='me'&&D.me?'me':'top';
  function draw(){
    const t=D.top||[];
    const pod=t.length>=3?`<div class="pod">${[1,0,2].map(i=>`<div class="${i===0?'one':''}"><div class="av" style="background:${hue(t[i][0])}">${esc(ini(t[i][0]))}</div><b>${esc(t[i][0])}</b><i>${t[i][1]}</i></div>`).join('')}</div>`:'';
    const list=t.slice(t.length>=3?3:0).map((x,i)=>`<div class="lr${x[2]?' me':''}"><span class="k">${i+(t.length>=3?4:1)}</span><div class="w"><b>${esc(x[0])}</b><span class="sm">${esc(x[3]||'')}</span></div><span class="s">${x[1]}</span></div>`).join('');
    const me=D.me;
    let body;
    if(tab==='top'){
      body=`${pod}${list}${D.mine?`<div class="lr me"><span class="k">${D.mine[0]}</span><div class="w"><b>${esc(D.mine[1])}</b><span class="sm">${esc(D.mine[3]||'')}</span></div><span class="s">${D.mine[2]}</span></div>`:''}<div class="sm" style="padding:6px 4px">${esc(D.note||'')}</div>`;
    }else{
      body=`<div class="card"><div class="row" style="justify-content:space-between;align-items:flex-start"><div><div class="sm">Shu oydagi ballingiz</div><div class="big">${me.total}</div><div class="sm">${esc(me.pos)}</div></div><div style="text-align:right"><span class="chip">${esc(me.lvl)}</span><div style="margin-top:8px"><span class="chip ${me.ok?'ok':'w'}">${me.ok?'Mukofotga yaroqli':'Davomatni oshiring'}</span></div></div></div>
      ${me.next?`<div class="bar"><i style="width:${Math.min(100,Math.round(me.total/me.next[0]*100))}%;background:var(--gold)"></i></div><div class="sm" style="margin-top:6px">${esc(me.next[1])} darajasigacha ${me.next[0]-me.total} ball</div>`:''}</div>
      <div class="card"><h3>Ko'rsatkichlarim</h3><div class="g2">${[['Davomat',me.att,me.attn],['Uyga vazifa',me.hw,me.hwn],['Takrorlash',me.tk,me.tkn]].map(x=>`<div><div class="sm">${x[0]}</div><b>${x[1]==null?'—':x[1]+'%'}</b><div class="bar"><i style="width:${x[1]||0}%"></i></div><div class="sm" style="margin-top:4px">${esc(x[2]||'')}</div></div>`).join('')}</div></div>
      <div class="card"><h3>Ball qayerdan keldi</h3>${me.bd.map(x=>`<div class="kv"><span>${esc(x[0])}</span><b style="color:${x[1]<0?'var(--bad)':'var(--ok)'}">${x[1]>0?'+':''}${x[1]}</b></div>`).join('')||'<div class="sm">Hali ball yo\'q.</div>'}</div>
      ${me.weak&&me.weak.length?`<div class="card"><h3>Qayta ishlang</h3><div class="row">${me.weak.map(w=>`<span class="chip w">${esc(w)}</span>`).join('')}</div></div>`:''}
      <div class="card"><h3>Seriya</h3><div class="sm">Ketma-ket dars: <b>${me.run}</b>. Har ${me.sn} tada +${me.sb} ball.</div></div>`;
    }
    $('#app').innerHTML=head(D.title||'Reyting',D.sub||'',null)+`<div class="wrap">${D.me?`<div class="tabs"><button data-t="top" class="${tab==='top'?'on':''}">Reyting</button><button data-t="me" class="${tab==='me'?'on':''}">Natijam</button></div>`:''}${body}</div>`;
  }
  draw();
  document.addEventListener('click',e=>{const t=e.target.closest('[data-t]');if(t){tab=t.dataset.t;draw()}});
}

if(!D)$('#app').innerHTML=head('ZAMIN education','')+'<div class="err">Ma\'lumot topilmadi. Ilovani bot ichidagi tugma orqali oching.</div>';
else if(P.get('v')==='att')att();else rank();
})();
</script>
